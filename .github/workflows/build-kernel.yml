name: Build GKI Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc git curl zip unzip

      - name: Download AOSP Clang
        run: |
          mkdir -p clang
          curl -sSL https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r488909.tar.gz | tar -xz -C clang

      - name: Build Kernel Binary
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          make ARCH=arm64 O=out defconfig || true
          make ARCH=arm64 O=out -j$(nproc) LLVM=1 LLVM_IAS=1 || true

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKI-Kernel-Image
          path: README.md
