name: Build GKI Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc git curl zip unzip clang llvm lld

      - name: Verify Build Setup
        run: |
          clang --version
          make --version
          echo "Build environment setup successfully completed!"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-Manifest
          path: README.md
